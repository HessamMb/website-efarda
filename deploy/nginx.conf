map $http_x_forwarded_proto $efarda_scheme {
    default $scheme;
    https   https;
}

log_format efarda '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log efarda;
    client_max_body_size 25m;

    location / {
        # Docker DNS resolves the app again when Compose recreates it.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $app_backend http://app:3000;
        proxy_pass $app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $efarda_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}
