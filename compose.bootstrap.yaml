services:
  app:
    environment:
      EFARDA_ADMIN_USERNAME: ${EFARDA_ADMIN_USERNAME:?Set EFARDA_ADMIN_USERNAME for bootstrap}
      EFARDA_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets:
      - admin_password

secrets:
  admin_password:
    file: ${EFARDA_ADMIN_SECRET_FILE:?Set EFARDA_ADMIN_SECRET_FILE to the bootstrap password file}
