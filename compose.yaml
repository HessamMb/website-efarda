services:
  app:
    build:
      context: .
      args:
        EFARDA_SITE_URL: ${EFARDA_SITE_URL:-http://localhost:8080}
    init: true
    restart: unless-stopped
    environment:
      EFARDA_SITE_URL: ${EFARDA_SITE_URL:-http://localhost:8080}
      EFARDA_SMTP_HOST: ${EFARDA_SMTP_HOST:-}
      EFARDA_SMTP_PORT: ${EFARDA_SMTP_PORT:-587}
      EFARDA_SMTP_USER: ${EFARDA_SMTP_USER:-}
      EFARDA_SMTP_PASSWORD: ${EFARDA_SMTP_PASSWORD:-}
      EFARDA_MAIL_FROM: ${EFARDA_MAIL_FROM:-}
      EFARDA_LOGIN_ALERT_EMAIL: ${EFARDA_LOGIN_ALERT_EMAIL:-}
    volumes:
      - posts:/var/lib/efarda
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 3

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${EFARDA_HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  posts:
    external: true
    name: ${EFARDA_DB_VOLUME:-efarda-posts}
